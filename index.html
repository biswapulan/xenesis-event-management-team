<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XENESIS 4.0 · Organising Team Registration</title>
<meta name="theme-color" content="#0b0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--char:#0b0f12;--crim:#b0202a;--moon:#7a1f24;--amber:#d9a15b;--bone:#e8e4da;--ink:#12171b;
--sans:'Montserrat','Helvetica Neue',Arial,sans-serif;--min:'Shippori Mincho','Yu Mincho','Hiragino Mincho ProN',serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--char);color:var(--bone);font:500 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- SCENE ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#07090c 0%,#0b1015 45%,#111a20 78%,#0b0f12 100%)}
.moon{position:absolute;top:9%;left:50%;width:min(46vmin,380px);aspect-ratio:1;translate:-50% 0;border-radius:50%;
background:radial-gradient(circle at 38% 34%,#c23a3c 0,#9a2a2f 34%,var(--moon) 70%,#5a171b 100%);
box-shadow:0 0 90px 30px rgba(176,32,42,.28),0 0 260px 90px rgba(122,31,36,.28);animation:glow 9s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 70px 20px rgba(176,32,42,.2),0 0 200px 70px rgba(122,31,36,.2)}to{box-shadow:0 0 110px 40px rgba(176,32,42,.36),0 0 300px 110px rgba(122,31,36,.34)}}
.land{position:absolute;left:0;bottom:0;width:100%;height:58%}
.fog{animation:fog 60s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(-60px)}}
.leaf{position:absolute;top:-30px;width:14px;height:14px;fill:var(--crim);opacity:0;animation:drift var(--d) linear var(--w) infinite}
@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.7}90%{opacity:.55}100%{transform:translate(var(--x),108vh) rotate(540deg);opacity:0}}
.grain{position:fixed;inset:-50%;z-index:5;pointer-events:none;opacity:.11;mix-blend-mode:overlay;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{to{transform:translate(-40px,30px)}}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.6) 100%)}

/* ---------- LAYOUT ---------- */
.app{position:relative;z-index:6;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,44px)}
.brand{font-weight:700;letter-spacing:.42em;font-size:12px;text-transform:uppercase}
.brand small{font:500 12px var(--min);letter-spacing:.2em;color:var(--amber);margin-left:12px}
.marks{display:flex;gap:9px;align-items:flex-end}
.marks i{display:block;width:2px;height:26px;background:rgba(232,228,218,.22);transform:skewX(-14deg);transition:background .5s,height .5s,box-shadow .5s}
.marks i.on{background:var(--crim);box-shadow:0 0 8px rgba(176,32,42,.7)}
.marks i.cur{height:34px}
main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 clamp(14px,4vw,44px) 16px}
.vt{position:fixed;right:clamp(10px,2.4vw,34px);top:50%;translate:0 -50%;writing-mode:vertical-rl;z-index:6;font-weight:600;letter-spacing:.7em;font-size:clamp(11px,1.6vw,15px);color:var(--bone);opacity:0;transition:opacity .8s;pointer-events:none}
body[data-screen=landing] .vt{opacity:.75}
#stage{width:100%;display:flex;flex-direction:column;align-items:center}

/* ---------- WASHI CARD ---------- */
.card{position:relative;width:min(640px,100%);padding:clamp(28px,5vw,52px) clamp(24px,5vw,56px);color:var(--ink);isolation:isolate;margin:auto}
.card::before{content:"";position:absolute;inset:0;z-index:-1;filter:url(#rough);
background:
 radial-gradient(ellipse at 0 0,rgba(11,15,18,.55),transparent 22%),radial-gradient(ellipse at 100% 100%,rgba(11,15,18,.5),transparent 24%),
 repeating-linear-gradient(97deg,rgba(120,105,80,.05) 0 1px,transparent 1px 7px),
 repeating-linear-gradient(8deg,rgba(255,255,255,.18) 0 1px,transparent 1px 11px),var(--bone);
box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card.dark{color:var(--bone)}
.card.dark::before{background:linear-gradient(180deg,rgba(11,15,18,.55),rgba(11,15,18,.78));backdrop-filter:blur(2px);box-shadow:none}
.card.dark{padding-inline:clamp(8px,2vw,24px)}
.kj{font:700 13px var(--min);letter-spacing:.3em;color:var(--crim);display:block;margin-top:8px}
.card.dark .kj{color:var(--amber)}
.qn{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--moon);font-weight:600}
h1,h2{font-weight:700;text-transform:uppercase;letter-spacing:.16em;line-height:1.3}
h1{font-size:clamp(26px,6.4vw,50px);letter-spacing:.14em}
h2{font-size:clamp(18px,3.6vw,26px);margin:10px 0 22px}
.blade{height:1px;margin:22px 0;border:0;background:linear-gradient(90deg,var(--crim),currentColor 40%,transparent);opacity:.7;position:relative}
.blade::before{content:"";position:absolute;left:0;top:-2px;width:26px;height:5px;background:var(--crim);clip-path:polygon(0 0,100% 45%,100% 55%,0 100%)}
.lead{max-width:44ch;opacity:.86;font-size:14px}
.meta{margin-top:18px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber)}

/* ---------- CONTROLS ---------- */
input[type=text],input[type=tel],input[type=email],textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(18,23,27,.55);
padding:10px 2px;font:500 19px var(--sans);letter-spacing:.04em;color:var(--ink);border-radius:0}
textarea{resize:vertical;min-height:130px;border:1.5px solid rgba(18,23,27,.5);padding:12px;font-size:16px;line-height:1.6;background:rgba(255,255,255,.28)}
input:focus,textarea:focus{outline:0;border-color:var(--crim);box-shadow:0 2px 0 var(--crim)}
textarea:focus{box-shadow:0 0 0 1px var(--crim)}
::placeholder{color:rgba(18,23,27,.4)}
.err{min-height:22px;margin-top:10px;font-size:12.5px;letter-spacing:.06em;color:var(--crim);font-weight:600}
.count{text-align:right;font-size:11px;letter-spacing:.2em;opacity:.6;margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{cursor:pointer;border:1.5px solid rgba(18,23,27,.6);padding:11px 18px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:.25s;user-select:none}
.opts label:hover{border-color:var(--crim)}
.opts input:checked+label{background:var(--crim);border-color:var(--crim);color:var(--bone);box-shadow:inset 0 0 0 1px rgba(232,228,218,.35)}
.opts input:focus-visible+label{outline:2px solid var(--amber);outline-offset:3px}
.big label{padding:16px 30px;font-size:14px}
.row{display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap}
.btn{font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;padding:15px 30px;border:1.5px solid var(--crim);background:var(--crim);color:var(--bone);cursor:pointer;transition:.25s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--moon);border-color:var(--moon);box-shadow:0 0 24px rgba(176,32,42,.45)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor;opacity:.85}
.btn.ghost:hover{background:rgba(176,32,42,.12);border-color:var(--crim);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:progress}
.hint{font-size:11px;letter-spacing:.14em;opacity:.55;margin-left:auto}

/* ---------- REVIEW ---------- */
.rv{list-style:none;padding:0}
.rv li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid rgba(18,23,27,.18)}
.rv b{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--moon);font-weight:600}
.rv span{grid-column:1;word-break:break-word;font-size:15px}
.rv button{grid-row:1/3;grid-column:2;background:none;border:0;border-bottom:1px solid var(--crim);color:var(--crim);font:700 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;align-self:center;padding:3px 0}

/* ---------- RESULT ---------- */
.scroll{position:relative;text-align:center}
.scroll .roll{position:absolute;left:-10px;right:-10px;height:16px;background:linear-gradient(180deg,#5a171b,#7a1f24 40%,#3b0f12);border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.scroll .roll:first-child{top:-8px}.scroll .roll:last-child{bottom:-8px}
.hanko{width:112px;height:112px;margin:8px auto 14px;display:block;transform:rotate(-6deg)}
.stamp{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) .4s both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.who{margin-top:16px;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.who small{display:block;font-weight:500;font-size:12px;letter-spacing:.3em;color:var(--moon);margin-top:4px}
.social{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.social .btn{padding:12px 20px;font-size:11px;letter-spacing:.2em;background:transparent;color:inherit;border-color:currentColor}
.social .btn:hover{background:var(--crim);color:var(--bone);border-color:var(--crim)}

/* ---------- SHOJI TRANSITION ---------- */
.shoji{position:fixed;inset:0;z-index:8;pointer-events:none;display:flex}
.shoji div{flex:1;transition:transform .42s cubic-bezier(.7,0,.3,1);
background:linear-gradient(90deg,rgba(217,161,91,.35) 2px,transparent 2px) 0 0/33.4% 100%,linear-gradient(180deg,rgba(217,161,91,.35) 2px,transparent 2px) 0 0/100% 25%,#c9c3b3;
box-shadow:0 0 40px rgba(0,0,0,.6)}
.shoji .l{transform:translateX(-101%)}.shoji .r{transform:translateX(101%)}
.shoji.shut .l,.shoji.shut .r{transform:none}
.shoji.shut{pointer-events:all}
.in{animation:unroll .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes unroll{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(-100px -100px -100px -100px)}}

/* ---------- LANDING ---------- */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;max-width:680px;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.logo{height:min(36dvh,320px);width:auto;max-width:78vw;display:block;filter:drop-shadow(0 6px 30px rgba(0,0,0,.6))}
.hero .blade{width:min(300px,60%);margin:clamp(12px,2.6dvh,24px) 0}
.dept{font-size:clamp(11px,2.7vw,14px);letter-spacing:.26em;text-transform:uppercase;font-weight:600}
.col{font-size:clamp(10px,2.4vw,12.5px);letter-spacing:.26em;text-transform:uppercase;opacity:.8;margin-top:6px}
.evt{font-size:clamp(15px,4.2vw,24px);letter-spacing:.24em;margin-top:clamp(14px,3dvh,26px);color:var(--bone)}
.why{max-width:38ch;margin-top:12px;font-size:clamp(12.5px,3.2vw,14px);line-height:1.6;opacity:.88;letter-spacing:.03em}
.tagline{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--amber);margin-top:10px}
body[data-screen=landing] header{visibility:hidden;padding:10px}
.foot{text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;padding:8px 12px calc(12px + env(safe-area-inset-bottom));text-shadow:0 1px 8px #000}

/* ---------- SMALL SCREENS ---------- */
@media (max-height:700px),(max-width:520px){
 header{padding-top:10px;padding-bottom:6px}
 .card{padding:20px 20px}h2{margin:6px 0 14px;font-size:17px}
 .opts{gap:7px}.opts label{padding:8px 11px;font-size:10.5px;letter-spacing:.1em}.big label{padding:12px 22px;font-size:12.5px}
 .err{min-height:18px;margin-top:6px}.row{margin-top:14px;gap:10px}.btn{padding:13px 20px;letter-spacing:.2em}
 .rv li{padding:7px 0}.rv span{font-size:13.5px}.rv b{font-size:9.5px}.blade{margin:14px 0}
 textarea{min-height:100px}.hanko{width:88px;height:88px}.social{margin-top:16px}.foot{font-size:10px}
}
@media (max-width:520px){.marks{gap:6px}.brand small{display:none}.hint{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.leaf{display:none}.shoji{display:none}}

/* ---------- SCROLL FIX ---------- */
/* keep the Back / Continue row reachable on long questions */
.card:not(.dark):not(.scroll) .row{
  position:sticky;bottom:0;z-index:2;
  margin-top:16px;padding:14px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(232,228,218,0),var(--bone) 35%);
}
</style>

 {k:"mobile",jp:"電話番号",t:"Mobile number",type:"tel",ac:"tel-national",ph:"10-digit number",v:v=>/^[6-9]\d{9}$/.test(v)?"":"Enter 10 digits starting with 6, 7, 8 or 9."},
 {k:"year",jp:"学年",t:"Year",type:"radio",opts:["2nd Year","3rd Year"],v:v=>v?"":"Choose your year."},
 {k:"email",jp:"メール",t:"Email ID",type:"email",ac:"email",ph:"you@example.com",v:v=>v.length<=254&&/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v)?"":"Enter a valid email address, like name@example.com."},
 {k:"segments",jp:"担当",t:"Segments you're interested in managing",type:"multi",opts:SEGMENTS,v:v=>v.length?"":"Select at least one segment."},
 {k:"message",jp:"一言",t:"Anything else you want to say?",type:"area",optional:true,v:v=>v.length<=300?"":"Keep it within 300 characters."}
];
const A={name:"",reg:"",mobile:"",year:"",email:"",segments:[],message:""};
let step=-1,fromReview=false,busy=false;
const $=s=>document.querySelector(s),stage=$("#stage"),shoji=$("#shoji");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const marks=$("#marks");marks.innerHTML="<i></i>".repeat(8);
function paintMarks(n){[...marks.children].forEach((m,i)=>{m.className=(i<n?"on":"")+(i===n-1?" cur":"")});marks.setAttribute("aria-valuenow",n)}

function go(fn,screen,n){
 const swap=()=>{fn();window.scrollTo(0,0);document.body.dataset.screen=screen;paintMarks(n);const f=stage.querySelector("[autofocus],input:not([type=radio]):not([type=checkbox]),textarea,.opts input:checked,.opts input,h1,h2,.btn");if(f){if(!f.matches("input,textarea,button,a"))f.tabIndex=-1;f.focus({preventScroll:true})}};
 if(reduce){swap();return}
 shoji.classList.add("shut");setTimeout(()=>{swap();requestAnimationFrame(()=>shoji.classList.remove("shut"))},440);
}

/* ====== SCREENS ====== */
function landing(){step=-1;go(()=>{stage.innerHTML=`<section class="hero in">
 <img class="logo" alt="Xenesis" src="${LOGO_SRC}">
 <p class="tagline">Where curiosity becomes creation.</p><hr class="blade">
 <p class="dept">Department of Computer Science &amp; Engineering</p>
 <p class="col">Government College of Engineering, Keonjhar</p>
 <h1 class="evt" tabindex="-1">Event Management Team Registration</h1>
 <p class="why">Pick the events and roles you'd like to manage at Xenesis 4.0, and join the organising team.</p>
 <div class="row"><button class="btn" id="start" autofocus>Start</button></div>
 <p class="meta">8 questions · 2 minutes</p></section>`;$("#start").onclick=()=>show(0)},"landing",0)}

function show(i){
 step=i;if(i>=Q.length)return review();
 const q=Q[i],val=A[q.k];let body="";
 if(q.type==="radio")body=`<div class="opts big" role="radiogroup" aria-labelledby="qt">${q.opts.map((o,j)=>`<input type="radio" name="r" id="o${j}" value="${o}" ${val===o?"checked":""}><label for="o${j}">${o}</label>`).join("")}</div>`;
 else if(q.type==="multi")body=`<div class="opts" role="group" aria-labelledby="qt">${q.opts.map((o,j)=>`<input type="checkbox" id="o${j}" value="${esc(o)}" ${val.includes(o)?"checked":""}><label for="o${j}">${esc(o)}</label>`).join("")}</div>`;
 else if(q.type==="area")body=`<textarea id="f" maxlength="300" aria-labelledby="qt" aria-describedby="e" placeholder="A question, an idea, a skill we should know about…">${esc(val)}</textarea><div class="count" id="c">${val.length} / 300</div>`;
 else body=`<input id="f" type="${q.type}" ${q.type==="tel"?'inputmode="numeric" maxlength="10"':""} ${q.type==="email"?'inputmode="email" maxlength="254"':""} autocomplete="${q.ac}" placeholder="${q.ph}" value="${esc(val)}" aria-labelledby="qt" aria-describedby="e" spellcheck="false">`;
 go(()=>{stage.innerHTML=`<section class="card in"><p class="qn">Question ${i+1} of 7${q.optional?" · optional":""}</p>
  <h2 id="qt">${q.t}<span class="kj" lang="ja">${q.jp}</span></h2>${body}<p class="err" id="e" role="alert"></p>
  <div class="row"><button class="btn ghost" id="bk">${fromReview?"Cancel":"Back"}</button>${q.optional?'<button class="btn ghost" id="sk">Skip</button>':""}<button class="btn" id="nx">${fromReview?"Save":"Continue"}</button><span class="hint">${q.type==="area"?"Ctrl + Enter":"Enter ↵"}</span></div></section>`;
  bind(q,i)},"q",i+1);
}

function read(q){
 if(q.type==="radio"){const c=stage.querySelector("input:checked");return c?c.value:""}
 if(q.type==="multi")return [...stage.querySelectorAll("input:checked")].map(x=>x.value);
 let v=$("#f").value;v=v.trim();if(q.k==="mobile")v=v.replace(/[\s-]/g,"").replace(/^(\+91|91|0)(?=\d{10}$)/,"");
 if(q.k==="email")v=v.toLowerCase();if(q.k==="reg")v=v.toUpperCase();return v;
}
function bind(q,i){
 const e=$("#e"),f=$("#f");
 const next=(skip)=>{const v=skip?"":read(q);const m=skip?"":q.v(v);if(m){e.textContent=m;f&&f.setAttribute("aria-invalid","true");(f||stage.querySelector("input")).focus();return}A[q.k]=v;fromReview?(fromReview=false,review()):show(i+1)};
 $("#nx").onclick=()=>next();
 $("#bk").onclick=()=>fromReview?(fromReview=false,review()):(i?show(i-1):landing());
 if($("#sk"))$("#sk").onclick=()=>{A.message="";next(true)};
 stage.querySelectorAll("input:not([type=radio]):not([type=checkbox])").forEach(x=>x.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();next()}}));
 stage.querySelectorAll(".opts input").forEach(x=>{x.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();next()}});x.addEventListener("change",()=>{e.textContent=""})});
 if(q.type==="area"){f.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();next()}});f.addEventListener("input",()=>{$("#c").textContent=f.value.length+" / 300"})}
 if(f)f.addEventListener("input",()=>{e.textContent="";f.removeAttribute("aria-invalid")});
}

function review(){
 step=Q.length;
 const rows=[["Name","name","氏名",A.name],["Registration number","reg","",A.reg],["Mobile","mobile","",A.mobile],["Year","year","",A.year],["Email","email","",A.email],["Segments","segments","",A.segments.join(", ")],["Message","message","",A.message||"Not provided"]];
 go(()=>{stage.innerHTML=`<section class="card in"><p class="qn">Review</p><h2 id="qt">Check your answers<span class="kj" lang="ja">確認</span></h2>
 <ul class="rv">${rows.map(([l,k,,v],n)=>`<li><b>${l}</b><span>${esc(v)}</span><button data-i="${n}" aria-label="Edit ${l}">Edit</button></li>`).join("")}</ul><p class="err" id="e" role="alert"></p>
 <div class="row"><button class="btn ghost" id="bk">Back</button><button class="btn" id="sub">Submit</button></div></section>`;
 stage.querySelectorAll(".rv button").forEach(b=>b.onclick=()=>{fromReview=true;show(+b.dataset.i)});
 $("#bk").onclick=()=>show(Q.length-1);$("#sub").onclick=submit;$("#sub").focus({preventScroll:true})},"q",8);
}

async function submit(){
 if(busy)return;
 for(const q of Q){const m=q.v(A[q.k]);if(m){fromReview=true;show(Q.indexOf(q));setTimeout(()=>{const e=$("#e");if(e)e.textContent=m},600);return}}
 busy=true;const b=$("#sub");b.disabled=true;b.textContent="Sending…";
 try{
  if(!/^https:\/\//.test(ENDPOINT))throw new Error("The form isn't connected to a sheet yet.");
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...A,segments:A.segments}),signal:ctl.signal});
  clearTimeout(t);const d=await r.json();
  if(d&&d.status==="success")done();else throw new Error((d&&d.message)||"The server rejected the entry.");
 }catch(err){fail(err.name==="AbortError"?"The request timed out.":err.message)}
 finally{busy=false}
}

const social=`<div class="social"><a class="btn" href="${LINKS.college}" target="_blank" rel="noopener">Follow us on LinkedIn · College</a><a class="btn" href="${LINKS.xenesis}" target="_blank" rel="noopener">Follow us on LinkedIn · Xenesis</a></div>`;
function done(){go(()=>{stage.innerHTML=`<section class="card scroll in"><i class="roll"></i><i class="roll"></i>
 <svg class="hanko stamp" viewBox="0 0 100 100" role="img" aria-label="Red hanko seal"><rect x="6" y="6" width="88" height="88" rx="4" fill="#b0202a"/><rect x="13" y="13" width="74" height="74" fill="none" stroke="#e8e4da" stroke-width="2" opacity=".8"/><text x="50" y="66" text-anchor="middle" font-family="Shippori Mincho,serif" font-weight="700" font-size="52" fill="#e8e4da">承</text></svg>
 <h2 style="margin:0" tabindex="-1" id="qt">Registration received</h2><span class="kj" lang="ja">受付完了</span><hr class="blade">
 <p class="who">${esc(A.name)}<small>${esc(A.reg)}</small></p><p class="lead" style="margin:16px auto 0">We'll reach out on your email or mobile number soon.</p>${social}</section>`},"done",8)}
function fail(msg){go(()=>{stage.innerHTML=`<section class="card in"><p class="qn">Not sent</p><h2 id="qt" tabindex="-1">We couldn't record your registration<span class="kj" lang="ja">送信失敗</span></h2>
 <p class="lead">${esc(msg)} Your answers are still here. Try again, or edit them first.</p>
 <div class="row"><button class="btn" id="try">Try Again</button><button class="btn ghost" id="ed">Edit</button></div>${social}</section>`;
 $("#try").onclick=()=>{review();setTimeout(submit,900)};$("#ed").onclick=review},"fail",8)}

landing();
</script>
</body>
</html>
